<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f6fc">
<title>澳新 12 天 · 4 人旅行手册</title>
<style>
:root{
  --bg:#f0f6fc; --bg2:#dce8f4; --card:#f8fbff; --ink:#1a2a3a; --muted:#6a7e92;
  --line:#b8cee2; --accent:#2a7ab5; --accent2:#1a6fa0;
  --shadow:0 1px 2px rgba(40,80,120,.06),0 8px 24px rgba(40,80,120,.08);
  --chip-bg:#d4e6f6;
}
body.night{
  --bg:#0a1220; --bg2:#0e1a2e; --card:#132036; --ink:#d8e4f0; --muted:#7a90a8;
  --line:#1e3450; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --chip-bg:#1a2a44;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .4s,color .4s}
a{color:var(--accent2);text-decoration:none}
main{max-width:780px;margin:0 auto;padding:0 14px 60px}
h2{margin:0}
.tnum{font-variant-numeric:tabular-nums}

#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#topbar b{font-size:15px;white-space:nowrap}
#nowclock{font-size:12px;color:var(--muted);text-align:right;line-height:1.35}
#nowclock .tm{font-size:17px;color:var(--ink);font-weight:600}

#chips{position:sticky;top:52px;z-index:10;display:flex;gap:6px;overflow-x:auto;padding:8px 14px;
  -webkit-overflow-scrolling:touch;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);max-width:780px;margin:0 auto}
.chip{flex:0 0 auto;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:var(--chip-bg)}

#banner{margin:12px auto 0;max-width:780px;padding:9px 13px;border-radius:12px;font-size:13px;
  background:#fff3d6;border:1px solid #e8c96a;color:#6b5215}
body.night #banner{background:#3a2f12;border-color:#6b5215;color:#e8d9a8}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:16px;margin:14px 0}
.sec .card{margin-top:14px}
.sec>h2{display:flex;align-items:center;gap:8px;font-size:17px;margin:22px 2px 4px}
.sec>h2 .en{font-size:12px;color:var(--muted);letter-spacing:.05em}

#nowcard{text-align:center;padding:20px 16px 18px;border-top:4px solid var(--accent)}
#nowcard .when{font-size:13px;color:var(--muted);margin-bottom:2px}
#nowcard .etitle{font-size:18px;font-weight:700;margin:2px 0 10px}
#cd{display:flex;justify-content:center;gap:8px;margin:8px 0 6px}
.cdbox{flex:1;max-width:110px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 2px}
.cdbox .n{font-size:clamp(30px,9vw,52px);font-weight:800;letter-spacing:.5px;line-height:1.05}
.cdbox .l{font-size:12px;color:var(--muted)}
#nowcard .ctx{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}

.mapwrap{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2)}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap svg .mlbl{font:600 11.5px system-ui,sans-serif;fill:var(--muted)}
.mapwrap svg .mlbl b{font-weight:800}
#mapBig svg{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#mapBig svg.grabbing{cursor:grabbing}
#mapBig .zoombtn{position:absolute;top:10px;left:10px;z-index:4;font:600 12px system-ui,sans-serif;color:#fff;background:rgba(31,47,82,.85);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#mapBig svg .dlt{font:600 10px system-ui,sans-serif;fill:var(--muted);opacity:.9}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.legend .lg{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center}
.nighttable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.nighttable td{padding:5px 6px;border-bottom:1px dashed var(--line)}

.rows .row{display:flex;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--line)}
.rows .row:last-child{border-bottom:none}
.row .ico{flex:0 0 34px;height:34px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px}
.row .body{flex:1;min-width:0}
.row .rt{font-weight:700}
.row .rd{font-size:13px;color:var(--muted);margin-top:2px}
.row .rl{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}
.btnrow{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.gbtn{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;color:var(--ink);background:var(--bg2);cursor:pointer}
.gbtn.nav{color:#fff;background:#1a73e8;border-color:#1a73e8}
.badge{display:inline-block;font-size:11px;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.badge.book{background:#fde7dd;color:#b23a0e;border:1px solid #f0b596}
.badge.sample{background:#ebeff9;color:#3a5a8c;border:1px solid #bfd0e8}
body.night .badge.book{background:#4a2414;color:#ffb38f;border-color:#7a3d1a}
body.night .badge.sample{background:#1f2b40;color:#a9c1ea;border-color:#32425f}

details.day{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
details.day>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
details.day>summary::-webkit-details-marker{display:none}
.ddot{flex:0 0 auto;width:12px;height:36px;border-radius:6px}
.dnum{flex:0 0 auto;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.dt{flex:1;min-width:0;font-size:13px;line-height:1.45;color:var(--muted)}
.dt b{color:var(--ink);font-size:15px;display:block}
.chev{margin-left:auto;color:var(--muted);transition:transform .25s;font-size:14px;flex:0 0 auto}
details.day[open] .chev{transform:rotate(180deg)}
.dbody{padding:0 14px 14px}
.timeline{border-left:2px solid var(--line);margin:6px 0 0 8px;padding-left:14px}
.tl{position:relative;padding:10px 0}
.tl::before{content:"";position:absolute;left:-20.5px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.tl .tt{font-size:13px;color:var(--muted);font-weight:600}
.tl .tr{font-size:15px;font-weight:700;margin-top:1px}
.tl .td{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.55}

ol.todo{list-style:none;padding:0;margin:4px 0 0;counter-reset:td}
ol.todo li{counter-reset:none;counter-increment:td;position:relative;padding:9px 4px 9px 42px;border-bottom:1px dashed var(--line);font-size:14.5px}
ol.todo li:before{content:counter(td);position:absolute;left:0;top:9px;width:26px;height:26px;border:1px solid var(--line);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.todonote{font-size:12px;color:var(--muted);margin-top:8px}

.tips{display:grid;grid-template-columns:1fr;gap:10px}
.tip{display:flex;gap:10px;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--card);box-shadow:var(--shadow)}
.tip .ti{font-size:20px}
.tip .th{font-weight:700;font-size:14.5px}
.tip .tb{font-size:13px;color:var(--muted);margin-top:2px}

footer{max-width:780px;margin:0 auto;padding:20px 14px 46px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
@media(min-width:640px){.tips{grid-template-columns:1fr 1fr}}
</style>
</head>

<header id="topbar">

  <div id="nowclock"><span class="tm tnum" id="clockTime">–:–:–</span><br><span id="clockTz"></span></div>
</header>

<nav id="chips">
  <a class="chip" href="#sec-now">此刻关注</a>
  <a class="chip" href="#sec-map">总览地图</a>
  <a class="chip" href="#sec-days">逐日行程</a>
  <a class="chip" href="#sec-todo">待办清单</a>
  <a class="chip" href="#sec-book">已确认预订</a>
  <a class="chip" href="#sec-tips">实用贴士</a>
</nav>

<main>

  <section class="sec" id="sec-now">
    <h2>⏱ 此刻关注 <span class="en">NOW</span></h2>
    <div class="card" id="nowcard"></div>
  </section>

  <section class="sec" id="sec-map">
    <h2>🗺 行程总览地图 <span class="en">MAP</span></h2>
    <div class="card">
      <div class="mapwrap" id="mapBig"></div>
      <div class="legend" id="mapLegend"></div>
      <table class="nighttable" id="nightTable"></table>
    </div>
  </section>

  <section class="sec" id="sec-days">
    <h2>📅 逐日行程 <span class="en">ITINERARY</span></h2>
    <div style="text-align:right;margin:8px 0 2px"><button class="gbtn" id="btnExpand" type="button">全部展开 / 收起</button></div>
    <div id="dayList"></div>
  </section>

  <section class="sec" id="sec-todo">
    <h2>✍️ 待办清单 <span class="en">TO-DO</span></h2>
    <div class="card">
      <ol class="todo" id="todoList"></ol>
      <div class="todonote">说明：做成纯列表，不做勾选框——勾选只存在各自的浏览器里，多人看到的会不一样。办完一项告诉我，我更新页面。</div>
    </div>
  </section>

  <section class="sec" id="sec-book">
    <h2>✅ 已确认的预订 <span class="en">BOOKED</span></h2>
    <div class="card"><div class="rows" id="bookRows"></div></div>
  </section>

  <section class="sec" id="sec-tips">
    <h2>💡 实用贴士 <span class="en">TIPS</span></h2>
    <div class="tips" id="tipList"></div>
  </section>

</main>

<footer>
  单文件站点 · 可离线查看 · 时间均已标注地区时区<br>
  由 Cloudflare 自动部署，push 即上线
</footer>

function toXY(r,p){ return {x:MAPSETT[r].x(p[0]), y:MAPSETT[r].y(p[1])}; }
function smoothPath(pts, jitter){
  var P = pts.map(function(p){ return {x:p.x+(Math.random()-.5)*jitter, y:p.y+(Math.random()-.5)*jitter}; });
  var d = "M"+P[0].x.toFixed(1)+","+P[0].y.toFixed(1), i, mx, my;
  for(i=1;i<P.length-1;i++){
    mx=(P[i].x+P[i+1].x)/2; my=(P[i].y+P[i+1].y)/2;
    d+="Q"+P[i].x.toFixed(1)+","+P[i].y.toFixed(1)+" "+mx.toFixed(1)+","+my.toFixed(1);
  }
  d+="Q"+(P[P.length-1].x).toFixed(1)+","+(P[P.length-1].y).toFixed(1)+" "+((P[P.length-1].x+P[0].x)/2).toFixed(1)+","+((P[P.length-1].y+P[0].y)/2).toFixed(1);
  return d;
}

  var off=len*0.24, sx=-dy/len, sy=dx/len, j=(Math.random()-.5)*7;
  return "M"+a.x.toFixed(1)+","+a.y.toFixed(1)+" Q"+(mx+sx*off+j).toFixed(1)+","+(my+sy*off+j).toFixed(1)+" "+b.x.toFixed(1)+","+b.y.toFixed(1);
}

    dot.setAttribute("stroke","#2a7ab5"); dot.setAttribute("stroke-width","3");
    g.appendChild(dot);
    var txt=document.createElementNS("http://www.w3.org/2000/svg","text");
    txt.setAttribute("class","mlbl"); txt.setAttribute("x","9"); txt.setAttribute("y","-6");
    txt.setAttribute("dominant-baseline","text-before-edge");
    txt.textContent=s.c.name+" · 第"+(s.start+(s.end>s.start?"–"+s.end:""))+"天";
    g.appendChild(txt);
    svg.appendChild(g);
  });
}
function routeLayer(svg, legs){
  legs.forEach(function(l,i){
    var p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", routePath(cityXY(l.from), cityXY(l.to)));
    p.setAttribute("fill","none"); p.setAttribute("stroke",l.color);
    p.setAttribute("stroke-width", l.hi ? "5" : "3");
    p.setAttribute("stroke-linecap","round");
    p.setAttribute("stroke-dasharray", l.hi ? "none" : ".5 9");
    p.setAttribute("stroke-opacity",".9");
    p.style.pointerEvents="none";
    svg.appendChild(p);
  });
}
function compass(svg){
  var g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("transform","translate(620,280)");
  var arrow=document.createElementNS("http://www.w3.org/2000/svg","path");
  arrow.setAttribute("d","M0,-14 L3.2,4 L0,1.5 L-3.2,4 Z");   arrow.setAttribute("fill","#2a7ab5");
  g.appendChild(arrow);
  var n=document.createElementNS("http://www.w3.org/2000/svg","text");
  n.setAttribute("x","0"); n.setAttribute("y","10"); n.setAttribute("text-anchor","middle");
  n.setAttribute("class","mlbl"); n.textContent="N";
  g.appendChild(n);
  var a=document.createElementNS("http://www.w3.org/2000/svg","text");
  a.setAttribute("x","0"); a.setAttribute("y","-20"); a.setAttribute("text-anchor","middle");
  a.setAttribute("class","mlbl"); a.textContent="北"; a.setAttribute("font-size","10");
  g.appendChild(a);
  svg.appendChild(g);
}
function renderMap(container, mode, dayNo){
  var legs = buildLegs();
  var svg = mapSvg();
  coastLayer(svg);
  if(mode==="overview"){
    routeLayer(svg, legs);
  } else {
    var match = legs.filter(function(l){ return dayNo>=l.start && dayNo<=l.end; })[0];
    if(match){ match.hi=true; routeLayer(svg,[match]); }
  }
  dotLayer(svg);
  compass(svg);
  container.innerHTML="";
  container.appendChild(svg);
  if(mode==="overview"){ detailsLayer(svg); scaleBarGroup(svg); attachZoom(svg, container); }
}
function attachZoom(svg, wrap){
  var base=(""+svg.getAttribute("viewBox")).split(/\s+/).map(Number);
  var vb={x:base[0],y:base[1],w:base[2],h:base[3]};
  var minW=Math.max(50,base[2]/8), minH=minW*base[3]/base[2];
  var pinch=null, dragStart=null, lastTap=0, lastZoomTs=0;
  function setVB(){
    svg.setAttribute("viewBox",[Math.round(vb.x),Math.round(vb.y),Math.round(vb.w),Math.round(vb.h)].join(" "));
  }
  function refresh(){
    setVB();
    updateScaleBar(svg, vb);
    updateDetails(svg, vb);
  }
  function clamp(){
    if(vb.w>base[2]){ vb.w=base[2]; vb.h=base[3]; }
    if(vb.w<minW){ vb.w=minW; vb.h=minH; }
    if(vb.x<base[0]) vb.x=base[0];
    if(vb.y<base[1]) vb.y=base[1];
    if(vb.x>base[0]+base[2]-vb.w) vb.x=base[0]+base[2]-vb.w;
    if(vb.y>base[1]+base[3]-vb.h) vb.y=base[1]+base[3]-vb.h;
  }
  function toXY(cx,cy){
    var r=svg.getBoundingClientRect();
    return {x:vb.x+(cx-r.left)/r.width*vb.w, y:vb.y+(cy-r.top)/r.height*vb.h};
  }
  function zoomBy(f,cx,cy){
    var p=toXY(cx,cy);
    var nw=vb.w/f, nh=vb.h/f;
    if(nw>base[2]+0.5 || nw<minW-0.5){ vb={x:base[0],y:base[1],w:base[2],h:base[3]}; }
    else{
      var r=nw/vb.w;
      vb.x=p.x-(p.x-vb.x)*r; vb.y=p.y-(p.y-vb.y)*r;
      vb.w=nw; vb.h=nh;
    }
    clamp(); refresh();
  }
  function panBy(dx,dy){
    if(!svg.getBoundingClientRect) return;
    var r=svg.getBoundingClientRect();
    if(!r.width||!r.height) return;
    vb.x-=dx/r.width*vb.w; vb.y-=dy/r.height*vb.h;
    clamp(); refresh();
  }
  function end(){ pinch=null; dragStart=null; svg.classList.remove("grabbing"); }
  svg.addEventListener("dblclick",function(e){
    if(+new Date()-lastZoomTs<500) return;
    if(e.preventDefault) e.preventDefault();
    zoomBy(1.8,e.clientX,e.clientY);
  });
  svg.addEventListener("wheel",function(e){
    if(e.preventDefault) e.preventDefault();
    zoomBy(e.deltaY<0?1.3:0.77,e.clientX,e.clientY);
  },{passive:false});
  svg.addEventListener("mousedown",function(e){
    dragStart={x:e.clientX,y:e.clientY};
    svg.classList.add("grabbing");
    if(e.preventDefault) e.preventDefault();
  });
  svg.addEventListener("mousemove",function(e){
    if(!dragStart) return;
    panBy(e.clientX-dragStart.x,e.clientY-dragStart.y);
    dragStart.x=e.clientX; dragStart.y=e.clientY;
  });
  svg.addEventListener("mouseup",end);
  svg.addEventListener("mouseleave",end);
  svg.addEventListener("touchstart",function(e){
    var t=e.touches;
    if(t.length===2){
      pinch={d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)};
      return;
    }
    if(t.length===1){
      var now=+new Date();
      if(now-lastTap<320){
        lastTap=0; lastZoomTs=+new Date();
        zoomBy(1.8,t[0].clientX,t[0].clientY);
        return;
      }
      lastTap=now;
      dragStart={x:t[0].clientX,y:t[0].clientY};
    }
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  svg.addEventListener("touchmove",function(e){
    if(pinch&&e.touches.length===2){
      var t=e.touches;
      var mx=(t[0].clientX+t[1].clientX)/2, my=(t[0].clientY+t[1].clientY)/2;
      var p=toXY(mx,my), d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
      if(d>0){
        var nw=Math.max(minW,Math.min(base[2],vb.w*d/pinch.d));
        var nh=nw*base[3]/base[2], r=nw/vb.w;
        vb.x=p.x-(p.x-vb.x)*r; vb.y=p.y-(p.y-vb.y)*r;
        vb.w=nw; vb.h=nh; clamp(); refresh();
      }
    }else if(dragStart&&e.touches.length===1){
      var t2=e.touches[0];
      panBy(t2.clientX-dragStart.x,t2.clientY-dragStart.y);
      dragStart.x=t2.clientX; dragStart.y=t2.clientY;
    }
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  svg.addEventListener("touchend",end);
  svg.addEventListener("touchcancel",end);
  var btn=document.createElement("button");
  btn.setAttribute("type","button");
  btn.setAttribute("class","zoombtn");
  btn.textContent="✕ 复位";
  btn.addEventListener("click",function(){ vb={x:base[0],y:base[1],w:base[2],h:base[3]}; clamp(); refresh(); });
  wrap.appendChild(btn);
  refresh();
}

/* ---------- 预订 ---------- */
function renderBookings(){
  var el=document.getElementById("bookRows"), html="";
  BOOKINGS.slice().sort(function(a,b){
    var ai=a.when&&a.when[0] ? new Date(a.when[0].t).getTime() : 0;
    var bi=b.when&&b.when[0] ? new Date(b.when[0].t).getTime() : 0;
    return ai-bi;
  }).forEach(function(b){
    var when="";
    if(b.when){
      when = b.when.map(function(w){
        var inst=new Date(w.t);
        return '🕐 <span class="tnum">'+fmtEditorial(inst, w.tz)+"</span>（"+w.tzLabel+"）";
      }).join("　");
    }
    var meta = "";
    if(b.anchor) meta+='<div class="rd">🎯 行程锚点：以这张出票时间为准</div>';
    if(b.note) meta+='<div class="rd">'+b.note+"</div>";
    var btns="";
    if(b.map) btns+='<a class="gbtn nav" target="_blank" rel="noopener" href="'+gmapNav(b.map.lat,b.map.lng)+'">🧭 导航</a>';
    if(b.addr) btns+='<a class="gbtn" target="_blank" rel="noopener" href="'+gmapPlace(b.addr)+'">📍 查看地址</a>';
    if(b.phone) btns+='<a class="gbtn" href="tel:'+b.phone.replace(/[^0-9+]/g,"")+'">📞 '+b.phone+"</a>";
    html+='<div class="row"><div class="ico">'+b.icon+'</div><div class="body">'
      +'<div class="rt">'+b.kind+' · '+b.title+(b.sample?'<span class="badge sample">示例·待替换</span>':"")
      +(b.anchor?'<span class="badge book">锚点</span>':"")+'</div>'
      +'<div class="rd">'+when+"</div>"+meta
      +(b.addr?'<div class="rl">📍 '+b.addr+"</div>":"")
      +'<div class="btnrow">'+btns+'</div>'
      +"</div></div>";
  });
  el.innerHTML=html;
}

/* ---------- 逐日 ---------- */
function eventRow(ev,d){
  var inst=instantOf(ev), time, tzNote="（"+d.tzLabel+"）", extra="";
  if(inst && !isNaN(inst)){
    var locT=fmtEditorial(inst,d.tz);
    try{
      var viewT=new Intl.DateTimeFormat("zh-CN",{timeZone:viewerTz,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,hourCycle:"h23"}).format(inst);
      if(viewT!==locT) extra=' <span class="tnum" style="color:var(--muted)">· 你的时区 '+viewT+'</span>';
    }catch(e){}
    time='<div class="tt tnum">'+fmtEditorial(inst,d.tz)+"　"+tzNote+extra+"</div>";
  } else {
    time='<div class="tt">⏱ 时间灵活，自行安排</div>';
  }
  var book = ev.book ? '<span class="badge book">需提前订票</span>' : "";
  var place = ev.place ? '<span class="td">📍 '+ev.place.name+"</span>" : "";
  var nav = ev.place&&(ev.place.lat!==undefined) ? '<a class="gbtn nav" target="_blank" rel="noopener" href="'+gmapNav(ev.place.lat,ev.place.lng)+'">🧭 去这里</a>' : "";
  return '<div class="tl">'+time
    +'<div class="tr">'+ev.title+book+"</div>"
    +(ev.detail?'<div class="td">'+ev.detail+"</div>":"")
    +place
    +(nav?'<div class="btnrow">'+nav+"</div>":"")
    +"</div>";
}
function dayNavLinks(d){
  var pts=[];
  d.events.forEach(function(ev){ if(ev.place&&ev.place.lat!==undefined) pts.push(ev.place); });
  if(pts.length<2) return "";
  var links=[], CH=9, i;
  for(i=0;i<pts.length;i+=CH){
    var c=pts.slice(i,i+CH);
    var u="https://www.google.com/maps/dir/?api=1&origin="+c[0].lat+","+c[0].lng
      +"&destination="+c[c.length-1].lat+","+c[c.length-1].lng
      +(c.length>2? "&waypoints="+c.slice(1,c.length-1).map(function(p){return p.lat+","+p.lng;}).join("|") : "");
    links.push('<a class="gbtn nav" target="_blank" rel="noopener" href="'+u+'">🚗 今天全天多点导航'+(pts.length>CH? "（第"+(i/CH+1)+"段）":"")+"</a>");
  }
  return '<div class="btnrow">'+links.join("")+'</div>';
}
function renderDays(){
  var list=document.getElementById("dayList"), html="";
  DAYS.forEach(function(d){
    var legs=buildLegs();
    var leg=legs.filter(function(l){return d.day>=l.start&&d.day<=l.end;})[0];
    var col = leg? leg.color : "#999";
    var wd=fmtWeekday(d.date,d.off,d.tz);
    html+='<details class="day" data-day="'+d.day+'">'
      +'<summary>'
      +'<span class="ddot" style="background:'+col+'"></span>'
      +'<span class="dnum">第'+d.day+'天</span>'
      +'<span class="dt"><b>'+wd+' · '+cityShort(d.home.name)+'</b>🏠 今夜：'+d.home.name+'</span>'
      +'<span class="chev">⌄</span>'
      +'</summary>'
      +'<div class="dbody">'
      +'<div class="btnrow"><button class="gbtn" type="button" data-map="'+d.day+'">🗺 展开今日路线地图</button>'
      +dayNavLinks(d)+"</div>"
      +'<div class="mapwrap" style="display:none;margin-top:10px" data-mmap="'+d.day+'"></div>'
      +'<div class="timeline">'+d.events.map(function(ev){return eventRow(ev,d);}).join("")+"</div>"
      +'<div class="btnrow"><a class="gbtn" target="_blank" rel="noopener" href="'+gmapNav(d.home.lat,d.home.lng)+'">🏠 导航到今夜住处</a></div>'
      +"</div></details>";
  });
  list.innerHTML=html;

  Array.prototype.forEach.call(list.querySelectorAll("details.day"), function(det){
    det.addEventListener("toggle", function(){
      var md=det.querySelector("[data-mmap]");
      if(det.open){
        if(md && md.getAttribute("data-rendered")!=="1"){
          renderMap(md,"day",parseInt(det.getAttribute("data-day"),10));
          md.setAttribute("data-rendered","1");
          md.style.display="block";
        }
      } else {
        if(md) md.style.display="none";
      }
    });
  });
  Array.prototype.forEach.call(list.querySelectorAll("button[data-map]"), function(b){
    b.addEventListener("click", function(){
      var det=b.closest("details.day");
      if(!det.open) det.open=true;
      var md=det.querySelector("[data-mmap]");
      if(md.getAttribute("data-rendered")!=="1"){
        renderMap(md,"day",parseInt(b.getAttribute("data-map"),10));
        md.setAttribute("data-rendered","1");
        md.style.display="block";
      }
      md.scrollIntoView({behavior:"smooth",block:"nearest"});
    });
  });
}
function toggleAll(){
  var dets=document.querySelectorAll("details.day");
  var anyOpen=false;
  Array.prototype.forEach.call(dets,function(d){ if(d.open) anyOpen=true; });
  Array.prototype.forEach.call(dets,function(d){ d.open=!anyOpen; });
}
function renderOverview(){
  var el=document.getElementById("mapBig");
  renderMap(el,"overview",null);
  var legs=buildLegs(), lg=document.getElementById("mapLegend"), html="";
  legs.forEach(function(l){
    html+='<span class="lg"><span class="swatch" style="background:'+l.color+'"></span>第'+l.start+(l.end>l.start?"–"+l.end:"")+'天 '+(l.start===l.end? "夜宿":"连住")+' '+cityShort(l.to.name)+(l.from.name!==l.to.name? "（自 "+cityShort(l.from.name)+"）":"")+"</span>";
  });
  html+='<span class="lg" style="opacity:.7">🔍 双击 / 双指缩放 · 拖动平移</span>';
  lg.innerHTML=html;
  var nt=document.getElementById("nightTable"), nh="";
  DAYS.forEach(function(d){
    nh+='<tr><td style="white-space:nowrap">第'+d.day+'天</td><td>🏠 '+d.home.name+'</td><td style="text-align:right">'
      +(d.home.lat!==undefined?'<a target="_blank" rel="noopener" href="'+gmapNav(d.home.lat,d.home.lng)+'">导航</a>':"")+'</td></tr>';
  });
  nt.innerHTML=nh;
}

/* ---------- 此刻关注 / 倒计时 ---------- */
function allEvents(){
  var out=[];
  DAYS.forEach(function(d){ d.events.forEach(function(ev){ if(ev.t) out.push({ev:ev,d:d,inst:new Date(ev.t)}); }); });
  out.sort(function(a,b){ return a.inst-b.inst; });
  return out;
}
function cdHtml(s){
  return '<div id="cd">'
    +'<div class="cdbox"><div class="n tnum">'+s.d+'</div><div class="l">天</div></div>'
    +'<div class="cdbox"><div class="n tnum">'+pad(s.h)+'</div><div class="l">时</div></div>'
    +'<div class="cdbox"><div class="n tnum">'+pad(s.m)+'</div><div class="l">分</div></div>'
    +'<div class="cdbox"><div class="n tnum">'+pad(s.s)+'</div><div class="l">秒</div></div></div>';
}
function renderNow(){
  var card=document.getElementById("nowcard"), now=new Date();
  var events=allEvents(), next=null, i;
  for(i=0;i<events.length;i++){ if(events[i].inst>now){ next=events[i]; break; } }
  var endInst=new Date(META.endIso), html="";
  if(next){
    var s=seg(next.inst-now);
    html+='<div class="when">下一个行程事件 · '+cityShort(next.d.home.name)+'</div>'
      +'<div class="etitle">'+next.ev.title+'</div>'
      +cdHtml(s)
      +'<div class="ctx">当地：'+fmtClock(next.inst,next.d.tz)+"（"+next.d.tzLabel+"）　·　你的时区 "+fmtClock(next.inst,viewerTz)+"<br>"
      +"📅 第 "+next.d.day+" 天　·　现在你的本地时间 "+fmtClock(now,viewerTz)+"</div>";
  } else if(endInst>now){
    html+='<div class="when">已排事件全部完成</div>'
      +'<div class="etitle">距 112 天行程结束</div>'
      +cdHtml(seg(endInst-now));
  } else {
    html+='<div class="when">🎉</div><div class="etitle">行程已全部结束</div><div class="ctx">辛苦啦，好好休息。</div>';
  }
  card.innerHTML=html;
}

/* ---------- 昼夜主题 ---------- */
var lastNight=null;
function applyTheme(){
  var h=new Date().getHours(), night=h>=19||h<6;
  if(night===lastNight) return;
  lastNight=night;
  document.body.classList.toggle("night",night);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", night?"#0a1220":"#f0f6fc");
  if(document.getElementById("mapBig").children.length) renderMap(document.getElementById("mapBig"),"overview",null);
  Array.prototype.forEach.call(document.querySelectorAll("[data-rendered='1']"),function(md){
    renderMap(md,"day",parseInt(md.getAttribute("data-mmap"),10));
  });
}
function clockTick(){
  var now=new Date();
  document.getElementById("clockTime").textContent=fmtClock(now,viewerTz);
  document.getElementById("clockTz").textContent=(viewerAbbr||viewerTz)+" · 你看到的时间";
  renderNow();
}

/* ---------- 启动 ---------- */
(function boot(){
  document.getElementById("btnExpand").addEventListener("click", toggleAll);
  renderOverview();
  applyTheme();
  renderBookings();
  renderDays();
  renderTodo();
  renderTips();
  clockTick();
  setInterval(clockTick,1000);
  setInterval(applyTheme,1000);
})();
</script>
